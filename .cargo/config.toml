# libxml-rs custom linker for the native Linux target (11.1-Z.1 three-DSO
# contract). The linker wrapper passes every link through to `cc` and then
# regenerates the libxslt/libexslt ELF facade DSOs (real SONAMEs + the
# upstream NEEDED chain) from the freshly linked staticlib, so a single
# `cargo build` yields three genuine DSOs:
#
#   lib/libxml2.so.16.1.3  -> liblibxml_rs.so (core, SONAME libxml2.so.16)
#   lib/libxslt.so.1.1.45  real facade DSO, SONAME libxslt.so.1, NEEDs libxml2.so.16
#   lib/libexslt.so.0.8.25 real facade DSO, SONAME libexslt.so.0, NEEDs libxslt.so.1 + libxml2.so.16
#
# The path is relative to the workspace root (cargo resolves it against the
# directory the build runs in; all repo tooling invokes cargo from the root).
# Cross builds / other targets are unaffected (keyed to the native triple).
# tools/ is excluded from the crates.io package, so published-crate builds
# (which never run this config) fall back to the symlink layout.
[target.x86_64-unknown-linux-gnu]
linker = "tools/packaging/linker-wrapper.sh"
