[package]
name = "libxml-rs-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.libxml-rs]
path = ".."

# Prevent this helper crate from being part of the parent workspace.
[workspace]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "html"
path = "fuzz_targets/html.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xpath"
path = "fuzz_targets/xpath.rs"
test = false
doc = false
bench = false
